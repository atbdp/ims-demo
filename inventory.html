<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory / Stock Management · ArchTech IMS (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
  ArchTech IMS — Inventory / Stock Management
  Standalone demo build: same design tokens, layout, and interaction logic
  as the real PHP+MySQL app, running here against in-memory demo data
  instead of a live database. Fonts load from Google Fonts (fine for a
  browser-side demo; the production app self-hosts them instead, since it
  has to keep working with no internet on an actual shop floor).
*/

:root {
  /* ---------------- Locked brand palette ---------------- */
  --deep-teal: #0E3B36;
  --deep-teal-700: #0B2F2B;
  --deep-teal-600: #123F39;
  --sidebar-active-bg: #14423C;
  --marigold: #E8A33D;
  --marigold-600: #D3922F;
  --marigold-700: #B87C22;
  --marigold-tint-12: rgba(232, 163, 61, 0.12);
  --off-white: #F7F5F0;
  --charcoal-ink: #1E2422;
  --alert-red: #C1483B;
  --alert-red-tint: #FBE7E4;
  --soft-sage: #B9CDB0;
  --soft-sage-tint: #EEF3EA;

  /* ---------------- Derived / extended (not in the locked 6, chosen to sit
     in the same family — see docs/PROPOSED-CHANGES.md) ---------------- */
  --success-bg: #E1F2D8;
  --success-text: #236B2A;
  --success-icon: #2E8B22;
  --danger-bg: #FCE7E4;
  --danger-text: #C1483B;
  --neutral-bg: #E8EAE9;
  --neutral-text: #4B5563;

  /* ---------------- Surfaces & text ---------------- */
  --bg-page: var(--off-white);
  --bg-surface: #FFFFFF;
  --bg-surface-alt: #F6F4EF;
  --bg-input: #FFFFFF;
  --text-primary: var(--charcoal-ink);
  --text-secondary: #62716A;
  --text-muted: #8A968F;
  --text-inverse: #FFFFFF;
  --text-on-sidebar: #E8EEEC;
  --text-on-sidebar-muted: #9FB3AE;

  --border-subtle: #E6E2D8;
  --border-strong: #D8D2C4;
  --border-sidebar: rgba(255, 255, 255, 0.08);
  --focus-ring: rgba(232, 163, 61, 0.45);

  /* ---------------- Typography ---------------- */
  --font-display: 'Sora', 'Noto Sans Bengali', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Noto Sans Bengali', 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', 'Noto Sans Bengali', ui-monospace, monospace;

  --fs-xs: 0.75rem;     /* 12px */
  --fs-sm: 0.8125rem;   /* 13px */
  --fs-base: 0.875rem;  /* 14px */
  --fs-md: 0.9375rem;   /* 15px */
  --fs-lg: 1.0625rem;   /* 17px */
  --fs-xl: 1.375rem;    /* 22px */
  --fs-2xl: 1.75rem;    /* 28px */

  /* ---------------- Spacing (4px grid) ---------------- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;

  /* ---------------- Radii ---------------- */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 999px;

  /* ---------------- Shadows ---------------- */
  --shadow-sm: 0 1px 2px rgba(30, 36, 34, 0.06);
  --shadow-md: 0 4px 16px rgba(14, 59, 54, 0.08);
  --shadow-lg: 0 12px 32px rgba(14, 59, 54, 0.14);

  /* ---------------- Layout ---------------- */
  --sidebar-width: 240px;
  --sidebar-width-collapsed: 76px;
  --pulse-height: 38px;
  --topbar-height: 76px;

  /* ---------------- Motion ---------------- */
  --ease-standard: cubic-bezier(0.2, 0.6, 0.2, 1);
  --dur-fast: 120ms;
  --dur-base: 180ms;
}

[dir='rtl'] { unicode-bidi: isolate; }

html[lang='bn'] body {
  font-family: 'Noto Sans Bengali', var(--font-body);
}


/*
  app.css — shared app shell.
  Layout anchor common to every screen: pulse strip, sidebar, topbar,
  plus the base component library (buttons, inputs, badges) screens
  compose from. Screen-specific layout lives in each screen's own CSS
  file (see assets/css/inventory.css).
*/

/* ---------------- Reset ---------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg-page);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul { margin: 0; padding: 0; list-style: none; }
svg { display: block; flex-shrink: 0; }
::selection { background: var(--marigold-tint-12); }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ---------------- App shell ---------------- */
.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------------- Pulse strip ---------------- */
.pulse-strip {
  height: var(--pulse-height);
  background: var(--deep-teal-700);
  color: var(--text-on-sidebar);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0 var(--sp-6);
  font-size: var(--fs-xs);
  font-weight: 500;
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow-x: auto;
  flex-shrink: 0;
}
.pulse-strip::-webkit-scrollbar { display: none; }
.pulse-item { display: inline-flex; align-items: center; gap: var(--sp-2); }
.pulse-sep { color: rgba(255,255,255,0.32); }
.pulse-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success-icon);
  box-shadow: 0 0 0 3px rgba(46, 139, 34, 0.22);
  flex-shrink: 0;
}
.pulse-dot[data-state='syncing'] { background: var(--marigold); box-shadow: 0 0 0 3px rgba(232,163,61,0.22); animation: pulse-blink 1.4s ease-in-out infinite; }
.pulse-dot[data-state='offline'] { background: #9AA6A2; box-shadow: 0 0 0 3px rgba(154,166,162,0.22); animation: none; }
@keyframes pulse-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.pulse-strip .icon-sm { width: 14px; height: 14px; color: var(--success-icon); }
.pulse-active-branch { color: var(--marigold); font-weight: 600; }
.pulse-strip strong { font-weight: 600; }

/* ---------------- Shell body: sidebar + main ---------------- */
.shell-body {
  flex: 1;
  display: flex;
  min-height: 0;
}

/* ---------------- Sidebar ---------------- */
.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  background: var(--deep-teal);
  display: flex;
  flex-direction: column;
  padding: var(--sp-6) 0 var(--sp-5);
  transition: width var(--dur-base) var(--ease-standard);
}
.sidebar-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-3);
  padding: 0 var(--sp-5) var(--sp-6);
  text-align: center;
}
.sidebar-brand-icon { width: 56px; height: 56px; color: var(--marigold); }
.sidebar-brand-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--fs-xl);
  color: #FFFFFF;
  letter-spacing: -0.01em;
}
.sidebar-brand-tagline {
  font-size: var(--fs-xs);
  color: var(--text-on-sidebar-muted);
}

.sidebar-nav { flex: 1; padding: 0 var(--sp-3); display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 11px var(--sp-4) 11px 17px;
  border-left: 3px solid transparent;
  border-radius: var(--radius-md);
  color: var(--text-on-sidebar);
  font-size: var(--fs-md);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard);
}
.nav-item .icon { width: 19px; height: 19px; opacity: 0.92; flex-shrink: 0; }
.nav-item:hover { background: rgba(255,255,255,0.06); color: #FFFFFF; }
.nav-item.is-active {
  background: var(--sidebar-active-bg);
  border-left-color: var(--marigold);
  color: var(--marigold);
  font-weight: 600;
}
.nav-item.is-active .icon { opacity: 1; }
.nav-label { overflow: hidden; text-overflow: ellipsis; }

.sidebar-footer {
  margin-top: var(--sp-5);
  padding: var(--sp-4) var(--sp-5) 0;
  border-top: 1px solid var(--border-sidebar);
  font-size: var(--fs-xs);
  line-height: 1.6;
  color: var(--text-on-sidebar-muted);
}

/* ---------------- Main column ---------------- */
.main-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-page);
}

/* ---------------- Topbar ---------------- */
.topbar {
  height: var(--topbar-height);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: var(--sp-5);
  padding: 0 var(--sp-6);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
}
.sidebar-toggle {
  background: none; border: none; padding: var(--sp-2);
  border-radius: var(--radius-md); color: var(--text-primary);
  display: flex; align-items: center; justify-content: center;
}
.sidebar-toggle:hover { background: var(--bg-surface-alt); }
.sidebar-toggle .icon { width: 22px; height: 22px; }

.topbar-search {
  flex: 1;
  max-width: 620px;
  position: relative;
  display: flex;
  align-items: center;
}
.topbar-search .icon-search {
  position: absolute; left: var(--sp-4); width: 17px; height: 17px; color: var(--text-muted);
}
.topbar-search input {
  width: 100%;
  height: 44px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  padding: 0 52px 0 44px;
  font-size: var(--fs-base);
  color: var(--text-primary);
  transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
}
.topbar-search input::placeholder { color: var(--text-muted); }
.topbar-search input:focus {
  outline: none; border-color: var(--marigold);
  box-shadow: 0 0 0 3px var(--focus-ring);
}
.kbd-hint {
  position: absolute; right: var(--sp-3);
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  padding: 2px 7px; background: var(--bg-surface-alt);
  pointer-events: none;
}

.topbar-spacer { flex: 1; }

.branch-select {
  display: flex; align-items: center; gap: var(--sp-2);
  height: 44px; padding: 0 var(--sp-4);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  background: var(--bg-surface); font-size: var(--fs-base); font-weight: 500;
  white-space: nowrap;
}
.branch-select .chev { color: var(--text-muted); }

.lang-toggle {
  display: flex; align-items: center; gap: 2px;
  padding: 3px; border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle); background: var(--bg-surface);
}
.lang-toggle button {
  border: none; background: none; padding: 7px 13px;
  border-radius: var(--radius-full); font-size: var(--fs-sm); font-weight: 600;
  color: var(--text-secondary);
}
.lang-toggle button.is-active { background: var(--deep-teal); color: #FFFFFF; }

.notif-btn {
  position: relative; width: 44px; height: 44px;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  background: var(--bg-surface); display: flex; align-items: center; justify-content: center;
}
.notif-btn .icon { width: 19px; height: 19px; color: var(--text-primary); }
.notif-badge {
  position: absolute; top: -6px; right: -6px;
  min-width: 19px; height: 19px; padding: 0 4px;
  border-radius: var(--radius-full); background: var(--marigold);
  color: #FFFFFF; font-size: 10.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--bg-surface);
}

.profile-menu { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1); border-radius: var(--radius-md); }
.profile-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--deep-teal); color: #FFFFFF;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.profile-avatar .icon { width: 20px; height: 20px; }
.profile-text { display: flex; flex-direction: column; line-height: 1.25; text-align: left; }
.profile-name { font-size: var(--fs-sm); font-weight: 600; }
.profile-role { font-size: 11px; color: var(--text-muted); }
.chev { width: 15px; height: 15px; color: var(--text-muted); flex-shrink: 0; }
.profile-menu .chev { margin-left: 2px; }

/* ---------------- Page content wrapper ---------------- */
.page-content {
  flex: 1;
  padding: var(--sp-6);
  min-width: 0;
}

/* ---------------- Buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  height: 42px; padding: 0 var(--sp-4);
  border-radius: var(--radius-md);
  font-size: var(--fs-base); font-weight: 600;
  border: 1px solid transparent;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-standard), border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast);
}
.btn .icon { width: 16px; height: 16px; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

.btn-outline {
  background: var(--bg-surface); border-color: var(--border-subtle); color: var(--text-primary);
}
.btn-outline:hover:not(:disabled) { border-color: var(--border-strong); background: var(--bg-surface-alt); }

.btn-primary {
  background: var(--marigold); color: #FFFFFF;
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover:not(:disabled) { background: var(--marigold-600); }

.btn-dark {
  background: var(--deep-teal); color: #FFFFFF;
}
.btn-dark:hover:not(:disabled) { background: var(--deep-teal-600); }

.btn-ghost {
  background: transparent; border-color: transparent; color: var(--text-primary);
}
.btn-ghost:hover:not(:disabled) { background: var(--bg-surface-alt); }

.btn-sm { height: 34px; padding: 0 var(--sp-3); font-size: var(--fs-sm); }
.btn-icon { width: 42px; padding: 0; }
.btn-block { width: 100%; }

.icon-btn {
  width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent; color: var(--text-primary);
}
.icon-btn.bordered { border-color: var(--border-subtle); background: var(--bg-surface); }
.icon-btn:hover { background: var(--bg-surface-alt); }
.icon-btn .icon { width: 16px; height: 16px; }

/* ---------------- Form controls ---------------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: var(--fs-xs); font-weight: 600; color: var(--text-secondary); }
.field-hint { font-size: 11px; color: var(--text-muted); }
.field-error { font-size: 11px; color: var(--alert-red); font-weight: 500; }

.control {
  height: 42px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--bg-input);
  padding: 0 var(--sp-3);
  font-size: var(--fs-base);
  color: var(--text-primary);
  width: 100%;
}
.control:focus { outline: none; border-color: var(--marigold); box-shadow: 0 0 0 3px var(--focus-ring); }
.control.has-error { border-color: var(--alert-red); }
textarea.control { height: auto; padding: var(--sp-3); resize: vertical; min-height: 76px; }

.select-wrap { position: relative; }
.select-wrap select.control { appearance: none; padding-right: 34px; cursor: pointer; }
.select-wrap .chev {
  position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--text-muted); pointer-events: none;
}

.input-icon-wrap { position: relative; display: flex; align-items: center; }
.input-icon-wrap .icon-leading { position: absolute; left: 13px; width: 16px; height: 16px; color: var(--text-muted); }
.input-icon-wrap .icon-trailing { position: absolute; right: 13px; width: 16px; height: 16px; color: var(--text-muted); }
.input-icon-wrap input.control { padding-left: 38px; }
.input-icon-wrap input.control.has-trailing { padding-right: 38px; }

.checkbox {
  width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--border-strong);
  accent-color: var(--marigold); cursor: pointer;
}

/* ---------------- Badges ---------------- */
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  height: 26px; padding: 0 12px;
  border-radius: var(--radius-full);
  font-size: 12.5px; font-weight: 700;
  white-space: nowrap;
}
.badge-success { background: var(--success-bg); color: var(--success-text); }
.badge-danger { background: var(--danger-bg); color: var(--danger-text); }
.badge-neutral { background: var(--neutral-bg); color: var(--neutral-text); }

/* ---------------- Dropdown menu (generic) ---------------- */
.dropdown { position: relative; display: inline-flex; }
.dropdown-panel {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 40;
  min-width: 190px; background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 6px;
  opacity: 0; visibility: hidden; transform: translateY(-4px);
  transition: opacity var(--dur-fast), transform var(--dur-fast), visibility var(--dur-fast);
}
.dropdown-panel.is-open { opacity: 1; visibility: visible; transform: translateY(0); }
.dropdown-panel button {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%;
  padding: 9px 10px; border-radius: var(--radius-sm); background: none; border: none;
  font-size: var(--fs-sm); font-weight: 500; color: var(--text-primary); text-align: left;
}
.dropdown-panel button:hover { background: var(--bg-surface-alt); }
.dropdown-panel .icon { width: 15px; height: 15px; color: var(--text-muted); }

/* ---------------- Toast ---------------- */
.toast-stack {
  position: fixed; bottom: var(--sp-6); right: var(--sp-6); z-index: 200;
  display: flex; flex-direction: column; gap: var(--sp-2); align-items: flex-end;
}
.toast {
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--charcoal-ink); color: #FFFFFF;
  padding: 12px 16px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  font-size: var(--fs-sm); font-weight: 500; max-width: 360px;
  animation: toast-in var(--dur-base) var(--ease-standard);
}
.toast.is-success { background: var(--deep-teal); }
.toast.is-error { background: var(--alert-red); }
.toast .icon { width: 16px; height: 16px; flex-shrink: 0; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ---------------- Modal ---------------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(14, 20, 18, 0.48);
  display: flex; align-items: center; justify-content: center; padding: var(--sp-6);
  z-index: 100; opacity: 0; visibility: hidden; transition: opacity var(--dur-base), visibility var(--dur-base);
}
.modal-overlay.is-open { opacity: 1; visibility: visible; }
.modal {
  width: 100%; max-width: 560px; max-height: calc(100vh - 64px);
  background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateY(12px) scale(0.98); transition: transform var(--dur-base) var(--ease-standard);
}
.modal-overlay.is-open .modal { transform: translateY(0) scale(1); }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--sp-5) var(--sp-6); border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
}
.modal-title { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 700; }
.modal-body { padding: var(--sp-6); overflow-y: auto; display: flex; flex-direction: column; gap: var(--sp-4); }
.modal-footer {
  display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-3);
  padding: var(--sp-5) var(--sp-6); border-top: 1px solid var(--border-subtle); flex-shrink: 0;
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
.form-grid .span-2 { grid-column: 1 / -1; }

/* ---------------- Scrollbar polish (desktop, webkit) ---------------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }


/*
  inventory.css — Inventory / Stock Management screen.
  Shell/component styles (buttons, inputs, badges, modal) live in app.css;
  this file is layout specific to this one screen.
*/

/* ---------------- Page header ---------------- */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-4);
  flex-wrap: wrap;
  margin-bottom: var(--sp-5);
}
.page-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--fs-2xl);
  letter-spacing: -0.01em;
  color: var(--text-primary);
}
.page-subtitle {
  margin-top: 4px;
  font-size: var(--fs-base);
  color: var(--text-secondary);
}
.page-actions { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }

/* ---------------- Filter bar ---------------- */
.filter-bar {
  display: flex;
  align-items: flex-end;
  gap: var(--sp-3);
  flex-wrap: wrap;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--sp-4) var(--sp-5);
  margin-bottom: var(--sp-5);
}
.filter-fields { display: flex; align-items: flex-end; gap: var(--sp-3); flex-wrap: wrap; flex: 1; }
.filter-field { width: 168px; flex-shrink: 0; }
.filter-scan { width: 232px; flex-shrink: 0; }
.filter-actions { display: flex; align-items: center; gap: var(--sp-2); flex-shrink: 0; }

/* ---------------- KPI cards ---------------- */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: var(--sp-4);
  margin-bottom: var(--sp-5);
}
.kpi-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--sp-4) var(--sp-4) var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  min-width: 0;
}
.kpi-card-head { display: flex; align-items: center; gap: 10px; }
.kpi-icon { width: 30px; height: 30px; flex-shrink: 0; }
.kpi-icon.tone-green { color: var(--success-icon); }
.kpi-icon.tone-marigold { color: var(--marigold); }
.kpi-icon.tone-red { color: var(--alert-red); }
.kpi-icon.tone-neutral { color: var(--text-muted); }
.kpi-icon-badge {
  width: 40px; height: 40px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.kpi-icon-badge.tone-green { background: var(--success-bg); }
.kpi-icon-badge.tone-marigold { background: var(--marigold-tint-12); }
.kpi-icon-badge.tone-red { background: var(--danger-bg); }
.kpi-icon-badge.tone-neutral { background: var(--neutral-bg); }
.kpi-icon-badge .kpi-icon { width: 20px; height: 20px; }
.kpi-label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-secondary); }
.kpi-value {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.7rem;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.kpi-value.tone-red { color: var(--alert-red); }
.kpi-value.tone-green { color: var(--success-text); }
.kpi-sub { font-size: var(--fs-xs); color: var(--text-muted); }
.kpi-card.is-loading .kpi-value { color: transparent; background: var(--bg-surface-alt); border-radius: 4px; }

/* ---------------- Table card ---------------- */
.table-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.table-scroll { overflow-x: auto; }

.data-table {
  width: 100%;
  min-width: 1240px;
  border-collapse: collapse;
  font-size: var(--fs-base);
  table-layout: auto;
}
.data-table thead th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg-surface-alt);
  text-align: left;
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--text-primary);
  padding: 13px 12px;
  white-space: nowrap;
  border-bottom: 1px solid var(--border-subtle);
}
.data-table th.col-checkbox, .data-table td.col-checkbox { width: 38px; padding-right: 0; padding-left: 16px; }
.data-table th.col-qty, .data-table td.col-qty-cell { width: 64px; }
.data-table th.col-unit, .data-table td.col-unit-cell { width: 60px; }
.th-sort {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: none;
  font: inherit; font-weight: 700; color: var(--text-primary); padding: 0; cursor: pointer;
}
.th-sort .icon { width: 13px; height: 13px; color: var(--text-muted); transition: color var(--dur-fast); }
.th-sort:hover .icon, .th-sort.is-active .icon { color: var(--marigold); }
.th-sort.is-active { color: var(--text-primary); }

.data-table tbody td {
  padding: 12px 12px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-primary);
  vertical-align: middle;
}
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover td { background: var(--bg-surface-alt); }
.data-table tbody tr.is-selected td { background: var(--marigold-tint-12); }

.cell-sku { font-family: var(--font-mono); font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; }
.cell-name { font-weight: 500; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.cell-muted { color: var(--text-secondary); white-space: nowrap; }
.cell-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.cell-qty { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.cell-qty.tone-green { color: var(--success-text); }
.cell-qty.tone-red { color: var(--alert-red); }
.cell-updated { display: flex; flex-direction: column; gap: 1px; font-size: var(--fs-sm); color: var(--text-secondary); white-space: nowrap; }
.cell-updated .date { color: var(--text-primary); font-weight: 500; }
.cell-actions { display: flex; align-items: center; gap: 6px; }

.table-empty, .table-loading, .table-error {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--sp-3); padding: 64px var(--sp-6); color: var(--text-muted); text-align: center;
}
.table-empty .icon, .table-error .icon { width: 34px; height: 34px; opacity: 0.6; }
.table-error { color: var(--alert-red); }
.table-loading .spin { width: 26px; height: 26px; color: var(--marigold); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton-row td { padding: 13px var(--sp-4); border-bottom: 1px solid var(--border-subtle); }
.skeleton-bar { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--bg-surface-alt) 25%, #EDEBE3 37%, var(--bg-surface-alt) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

/* ---------------- Pagination ---------------- */
.table-pagination {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-5); flex-wrap: wrap;
  border-top: 1px solid var(--border-subtle);
}
.pagination-summary { font-size: var(--fs-sm); color: var(--text-secondary); }
.pagination-summary strong { color: var(--text-primary); font-weight: 600; }
.per-page-select { width: 132px; flex-shrink: 0; }
.pagination-controls { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
.pager { display: flex; align-items: center; gap: 4px; }
.pager button {
  min-width: 34px; height: 34px; padding: 0 8px;
  border-radius: var(--radius-sm); border: 1px solid transparent; background: none;
  font-size: var(--fs-sm); font-weight: 600; color: var(--text-primary);
}
.pager button:hover:not(:disabled) { background: var(--bg-surface-alt); }
.pager button:disabled { color: var(--text-muted); cursor: not-allowed; }
.pager button.is-active { background: var(--deep-teal); color: #FFFFFF; }
.pager .ellipsis { padding: 0 4px; color: var(--text-muted); }

/* ---------------- Export dropdown, per-row "more" menu ---------------- */
.export-dropdown .dropdown-panel { min-width: 200px; }
.row-menu-panel { min-width: 168px; }
.row-menu-panel button.is-danger { color: var(--alert-red); }
.row-menu-panel button.is-danger .icon { color: var(--alert-red); }

/* ---------------- Responsive ---------------- */
@media (max-width: 1180px) {
  .kpi-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 1024px) {
  .sidebar {
    position: fixed;
    top: var(--pulse-height);
    bottom: 0;
    left: 0;
    z-index: 60;
    box-shadow: var(--shadow-lg);
    transform: translateX(-100%);
  }
  .app-shell.sidebar-open .sidebar { transform: translateX(0); }
  .sidebar-backdrop {
    display: none;
    position: fixed; inset: var(--pulse-height) 0 0 0; background: rgba(14,20,18,0.4); z-index: 50;
  }
  .app-shell.sidebar-open .sidebar-backdrop { display: block; }
  .topbar-search { max-width: 340px; }
  .branch-select { flex-shrink: 0; }
}

@media (max-width: 860px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .page-content { padding: var(--sp-4); }
  .topbar { padding: 0 var(--sp-4); gap: var(--sp-3); }
  .profile-text { display: none; }
  .lang-toggle { display: none; }
  .filter-bar { flex-direction: column; align-items: stretch; }
  .filter-field, .filter-scan { width: 100%; }
  .filter-fields { flex-direction: column; align-items: stretch; }
  .filter-actions { justify-content: flex-end; }
}

@media (max-width: 640px) {
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .page-actions { width: 100%; }
  .page-actions .btn { flex: 1; }
  .form-grid { grid-template-columns: 1fr; }
  .table-pagination { flex-direction: column; align-items: stretch; }
  .pagination-controls { justify-content: space-between; }
}

</style>
</head>

<script>
(function () {
  'use strict';

  /* ============================================================
     ICONS + SEED DATA are injected as JSON above this script tag
     (window.__ICONS__, window.__SEED__) — see the assembly step.
     ============================================================ */
  const ICONS = window.__ICONS__;
  const SEED = window.__SEED__;

  function icon(name, cls) {
    cls = cls || 'icon';
    return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }

  /* ============================================================
     In-memory "database" — a real, mutable copy of the seed data.
     Add Product / Adjust Stock genuinely mutate this array, so the
     demo behaves like the real app, just without a server.
     ============================================================ */
  let PRODUCTS = SEED.products.map((p) => Object.assign({}, p));
  let nextProductId = Math.max.apply(null, PRODUCTS.map((p) => p.id)) + 1;
  const BRANCHES = SEED.branches;
  const CATEGORIES = SEED.categories;
  const SUPPLIERS = SEED.suppliers;

  const state = {
    search: '', category_id: '', branch_id: '', supplier_id: '', stock_status: '',
    sort: '', dir: 'asc', page: 1, per_page: 10,
  };

  /* ============================================================
     Formatting helpers (mirror the PHP app's app/Support/format.php
     and assets/js/inventory.js one-for-one).
     ============================================================ */
  function money(n) {
    return '৳ ' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function num(n, decimals) {
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  function updatedParts(mysqlDatetime) {
    if (!mysqlDatetime) return { date: '—', time: '' };
    const d = new Date(String(mysqlDatetime).replace(' ', 'T'));
    if (isNaN(d.getTime())) return { date: '—', time: '' };
    return {
      date: d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
      time: d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
    };
  }
  function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s === null || s === undefined ? '' : String(s);
    return d.innerHTML;
  }
  function statusFor(qty, reorderLevel) {
    if (qty <= 0) return 'out_of_stock';
    if (qty <= reorderLevel) return 'low_stock';
    return 'in_stock';
  }
  const STATUS_BADGE = { in_stock: 'badge-success', low_stock: 'badge-danger', out_of_stock: 'badge-neutral' };
  const STATUS_LABEL = { in_stock: 'In Stock', low_stock: 'Low Stock', out_of_stock: 'Out of Stock' };
  const QTY_TONE = { in_stock: 'tone-green', low_stock: 'tone-red', out_of_stock: 'tone-red' };

  /* ============================================================
     Toasts
     ============================================================ */
  const toastStack = document.getElementById('toastStack');
  function showToast(message, tone) {
    const el = document.createElement('div');
    el.className = 'toast' + (tone ? ' is-' + tone : '');
    el.textContent = message;
    toastStack.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(8px)';
      setTimeout(() => el.remove(), 220);
    }, 3200);
  }
  document.addEventListener('click', (evt) => {
    const trigger = evt.target.closest('[data-toast]');
    if (trigger) showToast(trigger.getAttribute('data-toast'));
  });

  /* ============================================================
     Query engine — filters + sorts + paginates the in-memory
     PRODUCTS array the same way InventoryService/Product.php do
     against real SQL.
     ============================================================ */
  const SORTABLE = ['sku', 'name', 'category_name', 'branch_name', 'quantity', 'reorder_level', 'unit', 'cost_price', 'sale_price', 'status'];
  const STATUS_RANK = { out_of_stock: 0, low_stock: 1, in_stock: 2 };

  function queryProducts() {
    let rows = PRODUCTS.filter((p) => {
      if (state.search) {
        const q = state.search.toLowerCase();
        if (!p.name.toLowerCase().includes(q) && !p.sku.toLowerCase().includes(q)) return false;
      }
      if (state.category_id && String(p.category_id) !== String(state.category_id)) return false;
      if (state.branch_id && String(p.branch_id) !== String(state.branch_id)) return false;
      if (state.supplier_id && String(p.supplier_id) !== String(state.supplier_id)) return false;
      if (state.stock_status && p.status !== state.stock_status) return false;
      return true;
    });

    const sortKey = SORTABLE.includes(state.sort) ? state.sort : null;
    rows = rows.slice().sort((a, b) => {
      let av, bv;
      if (sortKey === 'status') { av = STATUS_RANK[a.status]; bv = STATUS_RANK[b.status]; }
      else if (sortKey) { av = a[sortKey]; bv = b[sortKey]; }
      else { av = a.id; bv = b.id; } // natural/insertion order default, same as the real app
      if (typeof av === 'string') { av = av.toLowerCase(); bv = String(bv).toLowerCase(); }
      let cmp = av < bv ? -1 : av > bv ? 1 : (a.id - b.id);
      return (sortKey && state.dir === 'desc') ? -cmp : cmp;
    });

    const total = rows.length;
    const start = (state.page - 1) * state.per_page;
    return { rows: rows.slice(start, start + state.per_page), total };
  }

  function computeKpis() {
    const distinctProducts = new Set(PRODUCTS.map((p) => p.id)).size;
    let totalValue = 0, low = 0, inStock = 0, out = 0;
    PRODUCTS.forEach((p) => {
      totalValue += p.stock_value;
      if (p.status === 'low_stock') low++;
      else if (p.status === 'in_stock') inStock++;
      else out++;
    });
    return { total_products: distinctProducts, total_stock_value: totalValue, low_stock_count: low, in_stock_count: inStock, out_of_stock_count: out };
  }

  function renderRows(rows) {

  function renderPagination(total) {
    const totalPages = Math.max(1, Math.ceil(total / state.per_page));
    const cur = state.page;

    const from = total === 0 ? 0 : (cur - 1) * state.per_page + 1;
    const to = Math.min(cur * state.per_page, total);
    document.getElementById('paginationSummary').innerHTML =
      `Showing <strong>${from}</strong> to <strong>${to}</strong> of <strong>${total.toLocaleString('en-US')}</strong> entries`;

    const pages = [];
    const add = (p) => { if (!pages.includes(p)) pages.push(p); };
    add(1); add(totalPages);
    for (let p = cur - 1; p <= cur + 1; p++) if (p >= 1 && p <= totalPages) add(p);
    const sorted = pages.sort((a, b) => a - b);

    let html = `<button data-page="prev" ${cur <= 1 ? 'disabled' : ''} aria-label="Previous page">${icon('chevron-left')}</button>`;
    let prev = 0;
    sorted.forEach((p) => {
      if (p - prev > 1) html += `<span class="ellipsis">&hellip;</span>`;
      html += `<button data-page="${p}" class="${p === cur ? 'is-active' : ''}">${p}</button>`;
      prev = p;
    });
    html += `<button data-page="next" ${cur >= totalPages ? 'disabled' : ''} aria-label="Next page">${icon('chevron-right')}</button>`;
    document.getElementById('pager').innerHTML = html;
  }

  function updateSortIndicators() {

  }

  document.getElementById('perPageSelect').addEventListener('change', (e) => {
    state.per_page = parseInt(e.target.value, 10);

  document.getElementById('exportCsvBtn').addEventListener('click', () => {
    const { rows } = (() => { const saved = state.per_page; state.per_page = 100000; const r = queryProducts(); state.per_page = saved; return r; })();
    const cols = ['sku', 'name', 'category_name', 'branch_name', 'quantity', 'reorder_level', 'unit', 'cost_price', 'sale_price', 'stock_value', 'status'];
    const lines = [cols.join(',')].concat(rows.map((p) => cols.map((c) => `"${String(p[c] ?? '').replace(/"/g, '""')}"`).join(',')));
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'inventory-export.csv';

    showToast('Exported ' + rows.length + ' rows to CSV', 'success');

  document.querySelector('.table-pagination').addEventListener('click', (evt) => {
    const btn = evt.target.closest('button[data-page]');

    const val = btn.getAttribute('data-page');
    if (val === 'prev') state.page = Math.max(1, state.page - 1);
    else if (val === 'next') state.page = Math.min(totalPages, state.page + 1);

  document.querySelectorAll('.modal-overlay').forEach((overlay) => {
    overlay.addEventListener('click', (evt) => {
      if (evt.target === overlay || evt.target.closest('[data-close-modal]')) closeModal(overlay);
    });
  });
  document.addEventListener('keydown', (evt) => {
    if (evt.key === 'Escape') document.querySelectorAll('.modal-overlay.is-open').forEach(closeModal);
  });
  function clearErrors(form) {
    form.querySelectorAll('.field-error').forEach((el) => (el.textContent = ''));
    form.querySelectorAll('.has-error').forEach((el) => el.classList.remove('has-error'));
  }

  /* ---- Add Product ---- */
  const addProductModal = document.getElementById('addProductModal');
  const addProductForm = document.getElementById('addProductForm');
  document.getElementById('btnAddProduct').addEventListener('click', () => {
    addProductForm.reset();
    clearErrors(addProductForm);
    openModal(addProductModal);
  });
  addProductForm.addEventListener('submit', (evt) => {
    evt.preventDefault();
    clearErrors(addProductForm);
    const fd = new FormData(addProductForm);
    const v = Object.fromEntries(fd.entries());

    const errors = {};
    if (!v.sku || !v.sku.trim()) errors.sku = 'SKU is required.';
    else if (PRODUCTS.some((p) => p.sku.toLowerCase() === v.sku.trim().toLowerCase())) errors.sku = 'This SKU already exists.';
    if (!v.name || !v.name.trim()) errors.name = 'Product name is required.';
    if (!v.sale_price || Number(v.sale_price) < 0) errors.sale_price = 'Enter a valid selling price.';
    if (Object.keys(errors).length) {
      Object.entries(errors).forEach(([field, msg]) => {
        const err = addProductForm.querySelector(`[data-error-for="${field}"]`);
        if (err) err.textContent = msg;
        const input = addProductForm.querySelector(`[name="${field}"]`);
        if (input) input.classList.add('has-error');
      });
      return;
    }

    const branch = BRANCHES.find((b) => String(b.id) === String(v.branch_id)) || BRANCHES[0];
    const category = CATEGORIES.find((c) => String(c.id) === String(v.category_id));
    const supplier = SUPPLIERS.find((s) => String(s.id) === String(v.default_supplier_id));
    const qty = Number(v.opening_qty || 0);
    const reorderLevel = Number(v.reorder_level || 0);

    const newProduct = {
      id: nextProductId++,
      sku: v.sku.trim(), name: v.name.trim(),
      category_id: category ? category.id : null, category_name: category ? category.name : null,
      branch_id: branch.id, branch_name: branch.name,
      unit: v.unit || 'Pcs', quantity: qty, reorder_level: reorderLevel,
      cost_price: Number(v.cost_price || 0), sale_price: Number(v.sale_price),
      stock_value: qty * Number(v.sale_price),
      status: statusFor(qty, reorderLevel),
      supplier_id: supplier ? supplier.id : null, supplier_name: supplier ? supplier.name : null,
      updated_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
    };
    PRODUCTS.unshift(newProduct);

    closeModal(addProductModal);
    showToast('Product added.', 'success');
    state.page = 1;
    refresh();
    refreshKpis();
  });

  /* ---- Adjust Stock ---- */
  const adjustStockModal = document.getElementById('adjustStockModal');
  const adjustStockForm = document.getElementById('adjustStockForm');
  const asProduct = document.getElementById('asProduct');
  const asBranch = document.getElementById('asBranch');
  const asCurrentQty = document.getElementById('asCurrentQty');

  function populateProductSelect(selectedId) {
    asProduct.innerHTML = '<option value="">Select...</option>' + PRODUCTS
      .slice().sort((a, b) => a.sku.localeCompare(b.sku))
      .map((p) => `<option value="${p.id}" data-branch-id="${p.branch_id}">${escHtml(p.sku)} — ${escHtml(p.name)} (${escHtml(p.branch_name)})</option>`)
      .join('');
    if (selectedId) asProduct.value = selectedId;
  }
  function findProduct(id, branchId) {
    return PRODUCTS.find((p) => String(p.id) === String(id) && (branchId == null || String(p.branch_id) === String(branchId)));
  }
  function refreshCurrentQty() {
    const opt = asProduct.selectedOptions[0];
    if (!opt || !opt.value) { asCurrentQty.value = '—'; return; }
    const branchId = opt.getAttribute('data-branch-id');
    if (branchId) asBranch.value = branchId;
    const p = findProduct(opt.value, branchId);
    asCurrentQty.value = p ? num(p.quantity, Number(p.quantity) === Math.trunc(p.quantity) ? 0 : 2) : '—';
  }
  asProduct.addEventListener('change', refreshCurrentQty);
  asBranch.addEventListener('change', refreshCurrentQty);

  function openAdjustModal(productId, branchId) {
    populateProductSelect(productId);
    if (branchId) asBranch.value = branchId;
    refreshCurrentQty();
    clearErrors(adjustStockForm);
    openModal(adjustStockModal);
  }
  document.getElementById('btnAdjustStock').addEventListener('click', () => openAdjustModal());

  adjustStockForm.addEventListener('submit', (evt) => {
    evt.preventDefault();
    clearErrors(adjustStockForm);
    const fd = new FormData(adjustStockForm);
    const v = Object.fromEntries(fd.entries());

    const errors = {};
    if (!v.product_id) errors.quantity_change = 'Choose a product.';
    const change = Number(v.quantity_change);
    if (!v.quantity_change || isNaN(change) || change === 0) errors.quantity_change = 'Enter a non-zero quantity change.';
    if (Object.keys(errors).length) {
      Object.entries(errors).forEach(([field, msg]) => {
        const err = adjustStockForm.querySelector(`[data-error-for="${field}"]`);
        if (err) err.textContent = msg;
      });
      return;
    }

    const p = findProduct(v.product_id, v.branch_id) || findProduct(v.product_id);
    const before = p.quantity;
    const after = Math.max(0, before + change);
    p.quantity = after;
    p.stock_value = after * p.sale_price;
    p.status = statusFor(after, p.reorder_level);
    p.updated_at = new Date().toISOString().slice(0, 19).replace('T', ' ');

    closeModal(adjustStockModal);
    showToast(`Stock updated: ${num(before, 0)} \u2192 ${num(after, 0)}`, 'success');
    refresh();
    refreshKpis();
  });

  /* ============================================================
     Boot
     ============================================================ */
  refresh();
  refreshKpis();
})();

</script>
</body>
</html>
